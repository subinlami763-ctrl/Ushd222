name: akash

on:
 workflow_dispatch:
  inputs:
   reset_apps:
    description: "Saved installed apps delete karke fresh Windows se shuru"
    type: boolean
    default: false

permissions:
 contents: write
 actions: write

# Naya run tab tak wait kare jab tak purana run apna Final Save pura na kar le
concurrency:
 group: akash-rdp
 cancel-in-progress: false

jobs:
 secure-rdp:
  runs-on: windows-2022
  timeout-minutes: 360
  defaults:
   run:
    shell: pwsh
  env:
   GH_TOKEN: ${{ github.token }}
   RDP_USER: akash
   RDP_PASS: "akash"
   RESET_APPS: ${{ inputs.reset_apps }}

  steps:
  - name: Record Job Start Time
    run: |
     $now = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
     "JOB_START=$now" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
     Write-Host "Job start: $now"
  - name: Restore Saved Data
    run: |
     $ErrorActionPreference = "Continue"
     $dir  = "C:\RDPData"
     $repo = $env:GITHUB_REPOSITORY
     $tar  = "$env:SystemRoot\System32\tar.exe"
     @'
     $ErrorActionPreference = "Continue"
     function Get-AssetNames {
      try { return @(gh release view rdp-data --repo $env:GITHUB_REPOSITORY --json assets -q ".assets[].name" 2>$null) } catch { return @() }
     }
     function Remove-Asset($n) {
      gh release delete-asset rdp-data $n --repo $env:GITHUB_REPOSITORY --yes 2>&1 | Out-Null
     }
     function Split-File($file, $prefix, [long]$size) {
      $in = [IO.File]::OpenRead($file)
      $buf = New-Object byte[] (4MB)
      $i = 0
      $names = @()
      while ($in.Position -lt $in.Length) {
       $i++
       $pn = "{0}.part{1:D3}" -f $prefix, $i
       $o = [IO.File]::Create($pn)
       [long]$written = 0
       while ($written -lt $size -and $in.Position -lt $in.Length) {
        $want = [int][Math]::Min([long]$buf.Length, [long]($size - $written))
        $n = $in.Read($buf, 0, $want)
        if ($n -le 0) { break }
        $o.Write($buf, 0, $n)
        $written += $n
       }
       $o.Close()
       $names += $pn
      }
      $in.Close()
      return $names
     }
     function Save-Archive($name, $baseDir, $sources, $excludes) {
      $tar = "$env:SystemRoot\System32\tar.exe"
      $d = "$env:TEMP\save"
      New-Item -ItemType Directory -Force -Path $d | Out-Null
      $f = "$d\$name"
      Remove-Item $f -Force -ErrorAction SilentlyContinue
      Get-ChildItem $d -Filter "$name.part*" -ErrorAction SilentlyContinue | Remove-Item -Force -ErrorAction SilentlyContinue
      $a = @("-czf", $f) + @($excludes) + @("-C", $baseDir) + @($sources)
      & $tar @a
      if (-not (Test-Path $f)) { Write-Host "$name ban hi nahi paya"; return }
      $len = (Get-Item $f).Length
      $mb = [math]::Round($len / 1MB)
      $existing = @(Get-AssetNames)
      if ($len -le 1800MB) {
       gh release upload rdp-data $f --repo $env:GITHUB_REPOSITORY --clobber
       if ($LASTEXITCODE -ne 0) { Write-Host "$name upload fail"; Remove-Item $f -Force -ErrorAction SilentlyContinue; return }
       foreach ($n in $existing) { if ($n -like "$name.part*") { Remove-Asset $n } }
       Write-Host "[$(Get-Date)] $name saved ($mb MB)"
      } else {
       $parts = @(Split-File $f "$d\$name" ([long]1800MB))
       $ok = $true
       foreach ($p in $parts) {
        gh release upload rdp-data $p --repo $env:GITHUB_REPOSITORY --clobber
        if ($LASTEXITCODE -ne 0) { $ok = $false; break }
       }
       if ($ok) {
        $keep = @($parts | ForEach-Object { Split-Path $_ -Leaf })
        foreach ($n in $existing) {
         if ($n -eq $name -or ($n -like "$name.part*" -and $keep -notcontains $n)) { Remove-Asset $n }
        }
        Write-Host "[$(Get-Date)] $name saved in $($parts.Count) parts ($mb MB)"
       } else { Write-Host "$name part upload fail, purana saved rakha" }
       foreach ($p in $parts) { Remove-Item $p -Force -ErrorAction SilentlyContinue }
      }
      Remove-Item $f -Force -ErrorAction SilentlyContinue
     }
     function Restore-Archive($name, $dest) {
      $tar = "$env:SystemRoot\System32\tar.exe"
      $t = $env:TEMP
      Remove-Item "$t\$name" -Force -ErrorAction SilentlyContinue
      Get-ChildItem $t -Filter "$name.part*" -ErrorAction SilentlyContinue | Remove-Item -Force -ErrorAction SilentlyContinue
      gh release download rdp-data --repo $env:GITHUB_REPOSITORY --pattern $name --dir $t --clobber 2>$null
      if (-not (Test-Path "$t\$name")) {
       gh release download rdp-data --repo $env:GITHUB_REPOSITORY --pattern "$name.part*" --dir $t --clobber 2>$null
       $parts = @(Get-ChildItem $t -Filter "$name.part*" -ErrorAction SilentlyContinue | Sort-Object Name)
       if ($parts.Count -gt 0) {
        $out = [IO.File]::Create("$t\$name")
        foreach ($p in $parts) {
         $in = [IO.File]::OpenRead($p.FullName)
         $in.CopyTo($out)
         $in.Close()
         Remove-Item $p.FullName -Force -ErrorAction SilentlyContinue
        }
        $out.Close()
       }
      }
      if (Test-Path "$t\$name") {
       New-Item -ItemType Directory -Force -Path $dest | Out-Null
       & $tar -xzf "$t\$name" -C $dest
       Remove-Item "$t\$name" -Force -ErrorAction SilentlyContinue
       return $true
      }
      return $false
     }
     function Get-AppSig($base, $src) {
      $cnt = 0; $sum = [long]0; $mx = [long]0
      foreach ($s in @($src)) {
       $p = Join-Path $base ($s -replace '/', '\')
       if (-not (Test-Path -LiteralPath $p)) { continue }
       foreach ($f in @(Get-ChildItem -LiteralPath $p -Recurse -File -Force -ErrorAction SilentlyContinue)) {
        if ($f.FullName -match '(?i)cache|crashpad|\\logs\\') { continue }
        $cnt++
        $sum += $f.Length
        $t = $f.LastWriteTimeUtc.Ticks
        if ($t -gt $mx) { $mx = $t }
       }
      }
      return "$cnt|$sum|$mx"
     }
     function Save-AppArchives($prof, [switch]$SigOnly) {
      $exApp = @(
       "--exclude=*Cache*", "--exclude=*cache*", "--exclude=Crashpad", "--exclude=GrShaderCache", "--exclude=ShaderCache",
       "--exclude=AppData/Local/Google/Chrome",
       "--exclude=AppData/Local/BraveSoftware",
       "--exclude=AppData/Local/Microsoft/Windows",
       "--exclude=AppData/Local/Microsoft/WindowsApps",
       "--exclude=AppData/Roaming/Microsoft/Windows",
       "--exclude=AppData/Roaming/.minecraft/assets",
       "--exclude=AppData/Roaming/.minecraft/libraries",
       "--exclude=AppData/Roaming/.minecraft/runtime",
       "--exclude=AppData/Roaming/.minecraft/logs",
       "--exclude=AppData/Roaming/.minecraft/webcache"
      )
      $sd = "C:\app-sigs"
      New-Item -ItemType Directory -Force -Path $sd | Out-Null
      $groups = @(
       @{ pre = "al"; rel = "AppData/Local"; skip = @("Temp", "Packages", "CrashDumps", "D3DSCache", "PeerDistRepub", "VirtualStore", "ConnectedDevices", "History", "Application Data", "Temporary Internet Files", "INetCache") },
       @{ pre = "ar"; rel = "AppData/Roaming"; skip = @() },
       @{ pre = "ao"; rel = "AppData/LocalLow"; skip = @() }
      )
      foreach ($g in $groups) {
       $root = Join-Path $prof ($g.rel -replace '/', '\')
       if (-not (Test-Path -LiteralPath $root)) { continue }
       $items = @(Get-ChildItem -LiteralPath $root -Force -ErrorAction SilentlyContinue | Where-Object {
        -not ($_.Attributes -band [IO.FileAttributes]::ReparsePoint) -and ($g.skip -notcontains $_.Name)
       })
       foreach ($it in $items) {
        $src = "$($g.rel)/$($it.Name)"
        $name = "$($g.pre)-" + ($it.Name -replace '[^A-Za-z0-9_-]', '_') + ".tgz"
        $sig = Get-AppSig $prof @($src)
        $sf = "$sd\$name.sig"
        if ($SigOnly) { Set-Content -Path $sf -Value $sig -NoNewline; continue }
        if ($sig -eq "0|0|0") { continue }
        if ((Test-Path $sf) -and ((Get-Content $sf -Raw).Trim() -eq $sig)) { continue }
        Save-Archive $name $prof @($src) $exApp
        $have = @(Get-AssetNames | Where-Object { $_ -eq $name -or $_ -like "$name.part*" })
        if ($have.Count -gt 0) { Set-Content -Path $sf -Value $sig -NoNewline }
        else { Write-Host "$name save nahi hua, agli baar phir try hoga" }
       }
      }
     }
     '@ | Set-Content -Path "C:\persist-lib.ps1"
     . "C:\persist-lib.ps1"
     New-Item -ItemType Directory -Force -Path $dir | Out-Null
     foreach ($f in "Desktop","Documents","Downloads","Pictures","Videos","Music") {
      New-Item -ItemType Directory -Force -Path "$dir\$f" | Out-Null
     }
     @'
     $ErrorActionPreference = "Continue"
     . "C:\persist-lib.ps1"
     $prof = $null
     $sid = $null
     try {
      $sid = (Get-LocalUser -Name $env:RDP_USER).SID.Value
      $prof = (Get-ItemProperty "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\ProfileList\$sid").ProfileImagePath
     } catch {}
     if (-not $prof) { $prof = "C:\Users\$env:RDP_USER" }
     Write-Host "Profile path: $prof"
     if (Test-Path "C:\save-apps.ps1") { & "C:\save-apps.ps1" }
     try {
      $wpDir = "C:\RDPData\wallpaper"
      New-Item -ItemType Directory -Force -Path $wpDir | Out-Null
      $cur = $null; $style = "10"; $tile = "0"
      if ($sid) {
       $hk = "Registry::HKEY_USERS\$sid\Control Panel\Desktop"
       if (Test-Path $hk) {
        $dp = Get-ItemProperty $hk
        $cur = $dp.Wallpaper
        if ($dp.WallpaperStyle) { $style = "$($dp.WallpaperStyle)" }
        if ($dp.TileWallpaper) { $tile = "$($dp.TileWallpaper)" }
       }
      }
      if (-not $cur -or -not (Test-Path $cur)) { $cur = "$prof\AppData\Roaming\Microsoft\Windows\Themes\TranscodedWallpaper" }
      if (Test-Path $cur) {
       $ext = [IO.Path]::GetExtension($cur); if (-not $ext) { $ext = ".jpg" }
       $dest = "$wpDir\wall$ext"
       if ($cur -ne $dest) {
        Get-ChildItem $wpDir -Filter "wall.*" -ErrorAction SilentlyContinue | Remove-Item -Force -ErrorAction SilentlyContinue
        Copy-Item $cur $dest -Force
       }
       @{ style = $style; tile = $tile } | ConvertTo-Json | Set-Content "$wpDir\settings.json"
       Write-Host "Wallpaper saved: $cur"
      } else { Write-Host "Wallpaper file nahi mili, purana saved wallpaper rakha" }
     } catch { Write-Host "Wallpaper save fail: $_" }
     try {
      $hiv = "$env:TEMP\settings.hiv"
      Remove-Item $hiv -Force -ErrorAction SilentlyContinue
      if ($sid -and (Test-Path "Registry::HKEY_USERS\$sid")) {
       reg save "HKU\$sid" $hiv /y | Out-Null
      } elseif (Test-Path "$prof\NTUSER.DAT") {
       Copy-Item "$prof\NTUSER.DAT" $hiv -Force -ErrorAction SilentlyContinue
      }
      if (Test-Path $hiv) {
       gh release upload rdp-data $hiv --repo $env:GITHUB_REPOSITORY --clobber
       Write-Host "[$(Get-Date)] Windows settings saved"
      } else { Write-Host "Settings hive nahi bana, purana saved rakha" }
     } catch { Write-Host "Settings save fail: $_" }
     if (Test-Path "C:\save-ts.ps1") { & "C:\save-ts.ps1" }
     try {
      $ms = "$env:TEMP\machstage"
      Remove-Item $ms -Recurse -Force -ErrorAction SilentlyContinue
      New-Item -ItemType Directory -Force -Path "$ms\mach" | Out-Null
      $mkeys = @(
       "HKLM\SYSTEM\CurrentControlSet\Control\TimeZoneInformation",
       "HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp",
       "HKLM\SOFTWARE\Policies",
       "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies"
      )
      $mi = 0
      foreach ($mk in $mkeys) { $mi++; reg export $mk "$ms\mach\k$mi.reg" /y 2>&1 | Out-Null }
      Save-Archive "machine.tgz" $ms @("mach") @()
     } catch { Write-Host "machine settings save fail: $_" }
     Save-Archive "data.tgz" "C:\RDPData" @(".") @()
     # PEHLE apps (Discord etc.) save hote hain, har app ka alag chhota archive, sirf changed wale
     try { Save-AppArchives $prof } catch { Write-Host "App archives save fail: $_" }
     $exB = @("--exclude=*Cache*", "--exclude=*cache*", "--exclude=Crashpad", "--exclude=GrShaderCache", "--exclude=ShaderCache")
     $browsers = @(
      @{ n = "chrome.tgz";  p = @("AppData/Local/Google/Chrome") },
      @{ n = "brave.tgz";   p = @("AppData/Local/BraveSoftware") },
      @{ n = "shell.tgz";   p = @("AppData/Roaming/Microsoft/Windows/Start Menu", "AppData/Roaming/Microsoft/Windows/Themes", "AppData/Roaming/Microsoft/Windows/SendTo", "AppData/Roaming/Microsoft/Windows/Libraries", "AppData/Roaming/Microsoft/Windows/Templates", "AppData/Roaming/Microsoft/Internet Explorer/Quick Launch", "AppData/Roaming/Microsoft/Windows/PowerShell") },
      @{ n = "fonts.tgz";   p = @("AppData/Local/Microsoft/Windows/Fonts") }
     )
     foreach ($b in $browsers) {
      $have = @($b.p | Where-Object { Test-Path -LiteralPath ("$prof\" + ($_ -replace "/", "\")) })
      if ($have.Count -gt 0) { Save-Archive $b.n $prof $have $exB }
      else { Write-Host "$($b.n): data nahi mila, skip" }
     }
     $skipRoot = @("AppData", "Desktop", "Documents", "Downloads", "Pictures", "Videos", "Music", "OneDrive", "Application Data", "Local Settings", "My Documents", "Cookies", "NetHood", "PrintHood", "Recent", "SendTo", "Start Menu", "Templates")
     $rootItems = @(Get-ChildItem $prof -Force -ErrorAction SilentlyContinue | Where-Object {
      -not ($_.Attributes -band [IO.FileAttributes]::ReparsePoint) -and ($skipRoot -notcontains $_.Name) -and ($_.Name -notlike "NTUSER*") -and ($_.Name -notlike "ntuser*")
     } | ForEach-Object { $_.Name })
     if ($rootItems.Count -gt 0) { Save-Archive "profile.tgz" $prof $rootItems @("--exclude=*Cache*", "--exclude=*cache*") }
     exit 0
     '@ | Set-Content -Path "C:\save-data.ps1"
     @'
     $ErrorActionPreference = "Continue"
     try {
      $tsDir = "$env:ProgramData\Tailscale"
      if (-not (Test-Path "$tsDir\server-state.conf")) { Write-Host "Tailscale state file nahi mili, save skip"; exit 0 }
      $stage = "$env:TEMP\tsstage"
      Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue
      New-Item -ItemType Directory -Force -Path "$stage\Tailscale" | Out-Null
      Get-ChildItem $tsDir -File -ErrorAction SilentlyContinue | ForEach-Object { Copy-Item $_.FullName "$stage\Tailscale\" -Force -ErrorAction SilentlyContinue }
      if (-not (Test-Path "$stage\Tailscale\server-state.conf")) { Write-Host "Tailscale state copy nahi hui, save skip"; exit 0 }
      $f = "$env:TEMP\tailscale-state.tgz"
      Remove-Item $f -Force -ErrorAction SilentlyContinue
      & "$env:SystemRoot\System32\tar.exe" -czf $f -C $stage Tailscale
      gh release upload rdp-data $f --repo $env:GITHUB_REPOSITORY --clobber
      Write-Host "[$(Get-Date)] Tailscale state saved"
     } catch { Write-Host "Tailscale state save fail: $_" }
     exit 0
     '@ | Set-Content -Path "C:\save-ts.ps1"
     reg load HKU\DefTmp "C:\Users\Default\NTUSER.DAT" | Out-Null
     $k = "Registry::HKEY_USERS\DefTmp\Software\Microsoft\Windows\CurrentVersion\Explorer\User Shell Folders"
     if (-not (Test-Path $k)) { New-Item -Path $k -Force | Out-Null }
     $map = @{
      "Desktop" = "Desktop"
      "Personal" = "Documents"
      "{374DE290-123F-4565-9164-39C4925E467B}" = "Downloads"
      "My Pictures" = "Pictures"
      "My Video" = "Videos"
      "My Music" = "Music"
     }
     foreach ($n in $map.Keys) {
      Set-ItemProperty -Path $k -Name $n -Value "$dir\$($map[$n])" -Type ExpandString
     }
     [gc]::Collect(); [gc]::WaitForPendingFinalizers()
     Start-Sleep -Seconds 2
     reg unload HKU\DefTmp | Out-Null
     gh release view rdp-data --repo $repo *> $null
     if ($LASTEXITCODE -ne 0) {
      gh release create rdp-data --repo $repo --title "RDP data" --notes "Saved RDP data. Delete mat karna."
      Write-Host "Pehli baar run hai, purana data nahi hai."
     } else {
      if (Restore-Archive "data.tgz" $dir) {
       Write-Host "Purana data restore ho gaya."
      } else {
       gh release download rdp-data --repo $repo --pattern data.zip --dir $env:TEMP --clobber
       if (Test-Path "$env:TEMP\data.zip") {
        Expand-Archive "$env:TEMP\data.zip" -DestinationPath $dir -Force
        Write-Host "Purana data.zip restore ho gaya."
       } else {
        Write-Host "Abhi tak koi data save nahi hua."
       }
      }
     }
     exit 0
  - name: Restore Machine Settings
    run: |
     $ErrorActionPreference = "Continue"
     . "C:\persist-lib.ps1"
     $t = "$env:TEMP\mach-restore"
     Remove-Item $t -Recurse -Force -ErrorAction SilentlyContinue
     if (Restore-Archive "machine.tgz" $t) {
      foreach ($r in @(Get-ChildItem "$t\mach" -Filter "*.reg" -ErrorAction SilentlyContinue)) {
       reg import $r.FullName 2>&1 | Out-Null
      }
      Write-Host "Machine settings restore ho gayi."
     } else { Write-Host "Machine settings abhi tak save nahi hui." }
     exit 0
  - name: Chrome Login Fix (App-Bound Encryption OFF)
    run: |
     $ErrorActionPreference = "Continue"
     $k = 'HKLM:\SOFTWARE\Policies\Google\Chrome'
     New-Item -Path $k -Force | Out-Null
     Set-ItemProperty -Path $k -Name ApplicationBoundEncryptionEnabled -Value 0 -Type DWord
     Write-Host "Chrome ApplicationBoundEncryptionEnabled=0 set (Google login save hoga)"
     exit 0
  - name: Fresh Windows Cleanup
    run: |
     $ErrorActionPreference = "Continue"
     . "C:\persist-lib.ps1"
     $names = @(Get-AssetNames)
     if (($names -notcontains "fresh-v2.flag") -or ($env:RESET_APPS -eq "true")) {
      Write-Host "Purane saved apps (VS Code/Antigravity etc.) clear kar rahe hain"
      foreach ($n in $names) { if ($n -like "apps-files*" -or $n -like "apps-meta*") { Remove-Asset $n } }
      Set-Content -Path "$env:TEMP\fresh-v2.flag" -Value "ok" -NoNewline
      gh release upload rdp-data "$env:TEMP\fresh-v2.flag" --repo $env:GITHUB_REPOSITORY --clobber
     }
     foreach ($d in "C:\RDPData\Desktop", "C:\Users\Public\Desktop") {
      foreach ($pat in "Visual Studio Code*", "Antigravity*", "Codex*", "ChatGPT*", "Microsoft Edge*", "Firefox*", "R *", "RStudio*", "Unity Hub*", "Unity*") {
       Get-ChildItem $d -Filter "$pat.lnk" -ErrorAction SilentlyContinue | Remove-Item -Force -ErrorAction SilentlyContinue
      }
     }
     @'
     $ErrorActionPreference = "Continue"
     $procs = @()
     $ff = "C:\Program Files\Mozilla Firefox\uninstall\helper.exe"
     if (Test-Path $ff) { $procs += Start-Process $ff -ArgumentList "/S" -PassThru }
     $vs = "C:\Program Files\Microsoft VS Code\unins000.exe"
     if (Test-Path $vs) { $procs += Start-Process $vs -ArgumentList "/VERYSILENT", "/NORESTART", "/SUPPRESSMSGBOXES" -PassThru }
     $edge = Get-ChildItem "C:\Program Files (x86)\Microsoft\Edge\Application" -Directory -ErrorAction SilentlyContinue |
      Where-Object { $_.Name -match '^\d' } |
      ForEach-Object { Join-Path $_.FullName "Installer\setup.exe" } |
      Where-Object { Test-Path $_ } | Select-Object -First 1
     if ($edge) { $procs += Start-Process $edge -ArgumentList "--uninstall", "--system-level", "--verbose-logging", "--force-uninstall" -PassThru }
     Get-Process -Name "Unity Hub", "Unity" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
     $uh = "C:\Program Files\Unity Hub\Uninstall Unity Hub.exe"
     if (Test-Path $uh) { $procs += Start-Process $uh -ArgumentList "/S" -PassThru }
     $rU = Get-ChildItem "C:\Program Files\R" -Directory -ErrorAction SilentlyContinue | ForEach-Object { Join-Path $_.FullName "unins000.exe" } | Where-Object { Test-Path $_ } | Select-Object -First 1
     if ($rU) { $procs += Start-Process $rU -ArgumentList "/VERYSILENT", "/NORESTART", "/SUPPRESSMSGBOXES" -PassThru }
     foreach ($p in $procs) { if (-not $p.WaitForExit(120000)) { try { $p.Kill() } catch {} } }
     $sm = "C:\ProgramData\Microsoft\Windows\Start Menu\Programs"
     foreach ($pat in "Firefox*", "Microsoft Edge*", "R *", "RStudio*", "Unity Hub*", "Unity*") { Get-ChildItem $sm -Filter "$pat.lnk" -ErrorAction SilentlyContinue | Remove-Item -Force -ErrorAction SilentlyContinue }
     Remove-Item "$sm\Visual Studio Code" -Recurse -Force -ErrorAction SilentlyContinue
     foreach ($d in "Unity Hub", "R") { Remove-Item "$sm\$d" -Recurse -Force -ErrorAction SilentlyContinue }
     Set-Content -Path "C:\cleanup.done" -Value "ok"
     '@ | Set-Content -Path "C:\fresh-cleanup.ps1"
     Remove-Item "C:\cleanup.done" -Force -ErrorAction SilentlyContinue
     Start-Process powershell.exe -WindowStyle Hidden -ArgumentList "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "C:\fresh-cleanup.ps1"
     Write-Host "Cleanup background me shuru (Firefox/Edge/VS Code uninstall)."
     exit 0
  - name: Configure Core RDP Settings
    run: |
     $ErrorActionPreference = "Continue"
     Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
         -Name "fDenyTSConnections" -Value 0 -Force
     Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
         -Name "UserAuthentication" -Value 0 -Force
     Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
         -Name "SecurityLayer" -Value 0 -Force
     netsh advfirewall firewall delete rule name="RDP-Tailscale"
     netsh advfirewall firewall add rule name="RDP-Tailscale" `
     dir=in action=allow protocol=TCP localport=3389
     Restart-Service -Name TermService -Force
     exit 0
  - name: Set India Region (Timezone, Location, Language)
    run: |
     $ErrorActionPreference = "Continue"
     try { Set-TimeZone -Id "India Standard Time" } catch { tzutil /s "India Standard Time" }
     try { Set-WinHomeLocation -GeoId 113 } catch { Write-Host "HomeLocation fail: $_" }
     try { Set-Culture -CultureInfo en-IN } catch { Write-Host "Culture fail: $_" }
     try { Set-WinSystemLocale -SystemLocale en-IN } catch { Write-Host "SystemLocale fail: $_" }
     try { Set-WinUserLanguageList -LanguageList en-IN -Force } catch { Write-Host "LangList fail: $_" }
     try { Copy-UserInternationalSettingsToSystem -WelcomeScreen $true -NewUser $true } catch { Write-Host "Copy intl settings fail: $_" }
     Write-Host "Region set: India (IST, en-IN)"
     Write-Host "Time now: $(Get-Date)"
     exit 0
  - name: Enable Audio and Mic (RDP Redirection)
    run: |
     $ErrorActionPreference = "Continue"
     # Audio services ON (Server par default band/manual hoti hain)
     foreach ($svc in "AudioEndpointBuilder", "Audiosrv", "MMCSS") {
      Set-Service -Name $svc -StartupType Automatic -ErrorAction SilentlyContinue
      Start-Service -Name $svc -ErrorAction SilentlyContinue
     }
     # RDP: speaker + mic + camera redirection allow
     $ts = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
     New-Item -Path $ts -Force | Out-Null
     Set-ItemProperty -Path $ts -Name fDisableAudioCapture -Value 0 -Type DWord
     Set-ItemProperty -Path $ts -Name fDisableCam -Value 0 -Type DWord
     Set-ItemProperty -Path $ts -Name fDisableCdm -Value 0 -Type DWord
     Remove-ItemProperty -Path $ts -Name AudioRedirectionMode -ErrorAction SilentlyContinue
     $wsk = 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp'
     Set-ItemProperty -Path $wsk -Name fDisableAudioCapture -Value 0 -Type DWord -ErrorAction SilentlyContinue
     Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name fDisableAudioCapture -Value 0 -Type DWord -ErrorAction SilentlyContinue
     # Windows microphone privacy: apps (Discord) ko mic access allow
     $cap = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\CapabilityAccessManager\ConsentStore\microphone'
     New-Item -Path $cap -Force | Out-Null
     Set-ItemProperty -Path $cap -Name Value -Value Allow -Type String
     $pol = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\AppPrivacy'
     New-Item -Path $pol -Force | Out-Null
     Set-ItemProperty -Path $pol -Name LetAppsAccessMicrophone -Value 1 -Type DWord
     # Naye users (akash) ke liye bhi mic allow (Default profile)
     reg load HKU\DefAud "C:\Users\Default\NTUSER.DAT" | Out-Null
     $dk = 'Registry::HKEY_USERS\DefAud\Software\Microsoft\Windows\CurrentVersion\CapabilityAccessManager\ConsentStore\microphone'
     New-Item -Path $dk -Force | Out-Null
     Set-ItemProperty -Path $dk -Name Value -Value Allow -Type String
     [gc]::Collect(); [gc]::WaitForPendingFinalizers()
     Start-Sleep -Seconds 2
     reg unload HKU\DefAud | Out-Null
     Restart-Service -Name Audiosrv -Force -ErrorAction SilentlyContinue
     Restart-Service -Name TermService -Force -ErrorAction SilentlyContinue
     Get-Service AudioEndpointBuilder, Audiosrv, TermService | Format-Table Name, Status, StartType | Out-String | Write-Host
     Write-Host "Audio services ON, RDP speaker + mic redirection + mic privacy allow set"
     exit 0
  - name: Create RDP User (akash)
    run: |
     $ErrorActionPreference = "Continue"
     $user = $env:RDP_USER
     $pass = $env:RDP_PASS
     try {
      secedit /export /cfg C:\secpol.cfg | Out-Null
      (Get-Content C:\secpol.cfg) -replace 'PasswordComplexity = 1', 'PasswordComplexity = 0' -replace 'MinimumPasswordLength = \d+', 'MinimumPasswordLength = 0' | Set-Content C:\secpol.cfg
      secedit /configure /db C:\Windows\security\local.sdb /cfg C:\secpol.cfg /areas SECURITYPOLICY | Out-Null
     } catch { Write-Host "Password policy change fail: $_" }
     $securePass = ConvertTo-SecureString $pass -AsPlainText -Force
     if (Get-LocalUser -Name $user -ErrorAction SilentlyContinue) {
      Set-LocalUser -Name $user -Password $securePass
     } else {
      try {
       New-LocalUser -Name $user -Password $securePass -AccountNeverExpires -PasswordNeverExpires | Out-Null
      } catch {
       Write-Host "New-LocalUser fail ($_), net user se try kar rahe hain"
       net user $user "$pass" /add /y
      }
     }
     Add-LocalGroupMember -Group "Administrators" -Member $user -ErrorAction SilentlyContinue
     Add-LocalGroupMember -Group "Remote Desktop Users" -Member $user -ErrorAction SilentlyContinue
     if (-not (Get-LocalUser -Name $user -ErrorAction SilentlyContinue)) {
      Write-Error "User creation failed"
      exit 1
     }
     Write-Host "User '$user' ready."
  - name: Create Profile and Restore App Data
    run: |
     $ErrorActionPreference = "Continue"
     Add-Type -TypeDefinition @"
     using System;
     using System.Text;
     using System.Runtime.InteropServices;
     public class UserProf {
      [DllImport("userenv.dll", CharSet = CharSet.Unicode)]
      public static extern int CreateProfile(
       [MarshalAs(UnmanagedType.LPWStr)] string pszUserSid,
       [MarshalAs(UnmanagedType.LPWStr)] string pszUserName,
       [Out][MarshalAs(UnmanagedType.LPWStr)] StringBuilder pszProfilePath,
       uint cchProfilePath);
     }
     "@
     $sid = (Get-LocalUser -Name $env:RDP_USER).SID.Value
     Write-Host "RDP user SID: $sid"
     gh release download rdp-data --repo $env:GITHUB_REPOSITORY --pattern last-sid.txt --dir $env:TEMP --clobber 2>$null
     if (Test-Path "$env:TEMP\last-sid.txt") {
      $oldSid = (Get-Content "$env:TEMP\last-sid.txt" -Raw).Trim()
      if ($oldSid -eq $sid) { Write-Host "SID SAME HAI: saved login (Chrome/VS Code) chal sakte hain" }
      else { Write-Host "SID BADLA (purana $oldSid): Windows-encrypted login is machine par nahi chalega" }
     }
     Set-Content -Path "$env:TEMP\last-sid.txt" -Value $sid -NoNewline
     gh release upload rdp-data "$env:TEMP\last-sid.txt" --repo $env:GITHUB_REPOSITORY --clobber
     $sb  = New-Object System.Text.StringBuilder 260
     $hr  = [UserProf]::CreateProfile($sid, $env:RDP_USER, $sb, 260)
     Write-Host "CreateProfile result: $hr  path: $sb"
     $prof = $null
     try {
      $prof = (Get-ItemProperty "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\ProfileList\$sid").ProfileImagePath
     } catch {}
     if (-not $prof) {
      Write-Host "PROFILE NAHI BANA - AppData restore skip (varna login par galat profile ban sakta hai)"
      exit 0
     }
     Write-Host "Profile path: $prof"
     . "C:\persist-lib.ps1"
     # purane (legacy) archives pehle, phir naye per-app archives upar se overwrite karte hain
     foreach ($name in "appdata.tgz", "chrome.tgz", "brave.tgz", "shell.tgz", "fonts.tgz", "applocal.tgz", "approaming.tgz", "applow.tgz", "profile.tgz") {
      if (Restore-Archive $name $prof) { Write-Host "$name restore ho gaya." }
      else { Write-Host "$name abhi tak save nahi hua." }
     }
     $appNames = @(Get-AssetNames | ForEach-Object { $_ -replace '\.part\d+$', '' } | Where-Object { $_ -match '^(al|ar|ao)-.+\.tgz$' } | Sort-Object -Unique)
     foreach ($name in $appNames) {
      if (Restore-Archive $name $prof) { Write-Host "$name restore ho gaya." }
      else { Write-Host "$name restore nahi hua." }
     }
     try { Save-AppArchives $prof -SigOnly } catch { Write-Host "sig init fail: $_" }
     Write-Host "AppData\Local after restore: $((Get-ChildItem "$prof\AppData\Local" -Directory -Force -ErrorAction SilentlyContinue | ForEach-Object { $_.Name }) -join ', ')"
     try {
      $ErrorActionPreference = "Continue"
      gh release download rdp-data --repo $env:GITHUB_REPOSITORY --pattern settings.hiv --dir $env:TEMP --clobber 2>$null
      $hiv  = "$env:TEMP\settings.hiv"
      $hive = "$prof\NTUSER.DAT"
      if ((Test-Path $hiv) -and (Test-Path $hive)) {
       reg load HKU\RdpNew "$hive" | Out-Null
       reg load HKU\RdpOld "$hiv" | Out-Null
       $cv = "Software\Microsoft\Windows\CurrentVersion"
       $keys = @(
        "Control Panel", "Environment", "Keyboard Layout",
        "$cv\Themes", "$cv\Search", "$cv\Run", "$cv\Uninstall", "$cv\Policies",
        "$cv\Explorer\Advanced", "$cv\Explorer\Accent", "$cv\Explorer\StuckRects3",
        "$cv\Explorer\Taskband", "$cv\Explorer\CabinetState", "$cv\Explorer\HideDesktopIcons",
        "$cv\Explorer\Ribbon", "$cv\Explorer\StartPage", "$cv\Explorer\StartPage2",
        "Software\Microsoft\Windows\DWM", "Console", "Network", "Printers",
        "$cv\Explorer\FileExts", "$cv\Explorer\RecentDocs", "$cv\Explorer\TypedPaths",
        "$cv\Explorer\Wallpapers", "$cv\Explorer\VisualEffects", "$cv\Explorer\ComDlg32",
        "$cv\Explorer\Streams", "$cv\Applets", "$cv\Notifications\Settings",
        "Software\Microsoft\Windows NT\CurrentVersion\Fonts"
       )
       foreach ($k in $keys) {
        if (Test-Path -LiteralPath "Registry::HKEY_USERS\RdpOld\$k") {
         reg copy "HKU\RdpOld\$k" "HKU\RdpNew\$k" /s /f | Out-Null
        }
       }
       foreach ($v in @(Get-ChildItem "Registry::HKEY_USERS\RdpOld\Software" -ErrorAction SilentlyContinue)) {
        $vn = $v.PSChildName
        if ($vn -in "Microsoft", "Classes", "Policies", "Wow6432Node") { continue }
        reg copy "HKU\RdpOld\Software\$vn" "HKU\RdpNew\Software\$vn" /s /f | Out-Null
       }
       $msDeny = @("Windows", "Windows NT", "Cryptography", "SystemCertificates", "IdentityCRL", "Protected Storage System Provider", "Windows Defender", "Active Setup", "CTF", "Input", "InputPersonalization", "Personalization", "Multimedia", "MSF", "Speech", "SystemSettings", "Internet Explorer", "OneDrive", "WindowsRuntime")
       foreach ($v in @(Get-ChildItem "Registry::HKEY_USERS\RdpOld\Software\Microsoft" -ErrorAction SilentlyContinue)) {
        $vn = $v.PSChildName
        if ($msDeny -contains $vn) { continue }
        reg copy "HKU\RdpOld\Software\Microsoft\$vn" "HKU\RdpNew\Software\Microsoft\$vn" /s /f | Out-Null
       }
       [gc]::Collect(); [gc]::WaitForPendingFinalizers()
       Start-Sleep -Seconds 2
       reg unload HKU\RdpOld | Out-Null
       reg unload HKU\RdpNew | Out-Null
       Write-Host "Windows settings restore ho gayi."
      } else { Write-Host "Saved Windows settings abhi nahi hain, skip" }
     } catch { Write-Host "Settings restore fail: $_" }
     try {
      $wp = Get-ChildItem "C:\RDPData\wallpaper" -Filter "wall.*" -ErrorAction SilentlyContinue | Select-Object -First 1
      $hive = "$prof\NTUSER.DAT"
      if ($wp -and (Test-Path $hive)) {
       $style = "10"; $tile = "0"
       if (Test-Path "C:\RDPData\wallpaper\settings.json") {
        $j = Get-Content "C:\RDPData\wallpaper\settings.json" -Raw | ConvertFrom-Json
        if ($j.style) { $style = "$($j.style)" }
        if ($j.tile) { $tile = "$($j.tile)" }
       }
       reg load HKU\RdpWall "$hive" | Out-Null
       $k = "Registry::HKEY_USERS\RdpWall\Control Panel\Desktop"
       Set-ItemProperty -Path $k -Name Wallpaper -Value $wp.FullName
       Set-ItemProperty -Path $k -Name WallpaperStyle -Value $style
       Set-ItemProperty -Path $k -Name TileWallpaper -Value $tile
       @'
       $wp = Get-ChildItem "C:\RDPData\wallpaper" -Filter "wall.*" -ErrorAction SilentlyContinue | Select-Object -First 1
       if (-not $wp) { exit 0 }
       $style = "10"; $tile = "0"
       try {
        $j = Get-Content "C:\RDPData\wallpaper\settings.json" -Raw | ConvertFrom-Json
        if ($j.style) { $style = "$($j.style)" }
        if ($j.tile) { $tile = "$($j.tile)" }
       } catch {}
       $dk = "HKCU:\Control Panel\Desktop"
       Set-ItemProperty -Path $dk -Name WallpaperStyle -Value $style
       Set-ItemProperty -Path $dk -Name TileWallpaper -Value $tile
       Add-Type -TypeDefinition 'using System.Runtime.InteropServices; public class WallApply { [DllImport("user32.dll", CharSet = CharSet.Auto)] public static extern int SystemParametersInfo(int a, int b, string c, int d); }'
       [WallApply]::SystemParametersInfo(20, 0, $wp.FullName, 3) | Out-Null
     '@ | Set-Content -Path "C:\apply-wall.ps1"
       reg add "HKU\RdpWall\Software\Microsoft\Windows\CurrentVersion\Run" /v ApplyWallpaper /t REG_SZ /d "powershell.exe -NoProfile -WindowStyle Hidden -ExecutionPolicy Bypass -File C:\apply-wall.ps1" /f | Out-Null
       [gc]::Collect(); [gc]::WaitForPendingFinalizers()
       Start-Sleep -Seconds 2
       reg unload HKU\RdpWall | Out-Null
       Write-Host "Wallpaper restore set: $($wp.FullName)"
      } else { Write-Host "Saved wallpaper abhi nahi hai, skip" }
     } catch { Write-Host "Wallpaper restore fail: $_" }
     exit 0
  - name: Install Tailscale and Restore Saved Login
    run: |
     $ErrorActionPreference = "Continue"
     $installerPath = "$env:TEMP\tailscale.msi"
     $urls = @("https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi", "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi")
     foreach ($u in $urls) {
      try { Invoke-WebRequest -Uri $u -OutFile $installerPath -ErrorAction Stop; if (Test-Path $installerPath) { break } }
      catch { Write-Host "Tailscale download fail ($u): $_" }
     }
     if (-not (Test-Path $installerPath)) { Write-Error "Tailscale installer download nahi hua"; exit 1 }
     Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
     Remove-Item $installerPath -Force
     for ($i = 0; $i -lt 30; $i++) {
      $svc = Get-Service -Name "Tailscale" -ErrorAction SilentlyContinue
      if ($svc -and $svc.Status -eq "Running") { break }
      Start-Sleep -Seconds 2
     }
     gh release download rdp-data --repo $env:GITHUB_REPOSITORY --pattern tailscale-state.tgz --dir $env:TEMP --clobber 2>$null
     if (Test-Path "$env:TEMP\tailscale-state.tgz") {
      Stop-Service -Name "Tailscale" -Force -ErrorAction SilentlyContinue
      Start-Sleep -Seconds 3
      New-Item -ItemType Directory -Force -Path "$env:ProgramData" | Out-Null
      & "$env:SystemRoot\System32\tar.exe" -xzf "$env:TEMP\tailscale-state.tgz" -C "$env:ProgramData"
      Start-Service -Name "Tailscale" -ErrorAction SilentlyContinue
      for ($i = 0; $i -lt 30; $i++) {
       $svc = Get-Service -Name "Tailscale" -ErrorAction SilentlyContinue
       if ($svc -and $svc.Status -eq "Running") { break }
       Start-Sleep -Seconds 2
      }
      Write-Host "Purana Tailscale login restore ho gaya."
     } else {
      Write-Host "Pehli baar hai, Tailscale login ek baar karna padega."
     }
     exit 0
  - name: Install Extra Apps (apps.txt)
    run: |
     $ErrorActionPreference = "Continue"
     $list = "C:\RDPData\apps.txt"
     if (-not (Test-Path $list)) { Write-Host "apps.txt nahi hai, skip"; exit 0 }
     foreach ($line in Get-Content $list) {
      $l = $line.Trim()
      if (-not $l -or $l.StartsWith("#")) { continue }
      Write-Host "=== $l ==="
      try {
       if ($l -like "choco:*") { choco install $l.Substring(6) -y --no-progress; continue }
       if ($l -match '^https?://') {
        $ext = if ($l -match '\.msi($|\?)') { ".msi" } else { ".exe" }
        $f = "$env:TEMP\" + [guid]::NewGuid().ToString("N") + $ext
        Invoke-WebRequest -Uri $l -OutFile $f
       } elseif ($l -like "file:*") {
        $f = Join-Path "C:\RDPData" $l.Substring(5)
       } else {
        choco install $l -y --no-progress; continue
       }
       if (-not (Test-Path $f)) { Write-Host "File nahi mili: $f"; continue }
       if ($f -like "*.msi") {
        $p = Start-Process msiexec -ArgumentList "/i", "`"$f`"", "/qn", "/norestart", "ALLUSERS=1" -PassThru
       } else {
        $p = Start-Process $f -ArgumentList "/S", "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/ALLUSERS" -PassThru
       }
       if (-not $p.WaitForExit(300000)) { $p.Kill(); Write-Host "Timeout (5 min): $l" }
       else { Write-Host "Done, exit code: $($p.ExitCode)" }
      } catch { Write-Host "Fail: $l -> $_" }
     }
     exit 0
  - name: App Capture - Baseline lo aur purane installed apps restore karo
    run: |
     $ErrorActionPreference = "Continue"
     $tar = "$env:SystemRoot\System32\tar.exe"
     for ($i = 0; $i -lt 70 -and -not (Test-Path "C:\cleanup.done"); $i++) { Start-Sleep -Seconds 2 }
     Write-Host "Cleanup done: $(Test-Path 'C:\cleanup.done')"
     @'
     function Get-Names($p, [switch]$Dir) {
      if (-not (Test-Path -LiteralPath $p)) { return @() }
      if ($Dir) { return @(Get-ChildItem -LiteralPath $p -Directory -Force -ErrorAction SilentlyContinue | ForEach-Object { $_.Name }) }
      return @(Get-ChildItem -LiteralPath $p -Force -ErrorAction SilentlyContinue | ForEach-Object { $_.Name })
     }
     function Get-Names2($p) {
      $o = @()
      foreach ($t in @(Get-ChildItem -LiteralPath $p -Directory -Force -ErrorAction SilentlyContinue)) {
       foreach ($c in @(Get-ChildItem -LiteralPath $t.FullName -Directory -Force -ErrorAction SilentlyContinue)) { $o += "$($t.Name)/$($c.Name)" }
      }
      return $o
     }
     function Get-Keys($p) {
      if (-not (Test-Path -LiteralPath $p)) { return @() }
      return @(Get-ChildItem -LiteralPath $p -ErrorAction SilentlyContinue | ForEach-Object { $_.PSChildName })
     }
     function Get-New($cur, $base) {
      $hs = New-Object 'System.Collections.Generic.HashSet[string]' ([StringComparer]::OrdinalIgnoreCase)
      foreach ($b in @($base)) { if ($null -ne $b) { [void]$hs.Add([string]$b) } }
      return @(@($cur) | Where-Object { $_ -and -not $hs.Contains([string]$_) })
     }
     function Get-AppState {
      $cv   = "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion"
      $cv32 = "HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion"
      $mev = @{}
      $me = [Environment]::GetEnvironmentVariables("Machine")
      foreach ($k in $me.Keys) { if ($k -ne "Path") { $mev["$k"] = "$($me[$k])" } }
      return @{
       pf       = (Get-Names "C:\Program Files" -Dir)
       pf86     = (Get-Names "C:\Program Files (x86)" -Dir)
       pf2      = (Get-Names2 "C:\Program Files")
       pf862    = (Get-Names2 "C:\Program Files (x86)")
       cf       = (Get-Names "C:\Program Files\Common Files" -Dir)
       cf86     = (Get-Names "C:\Program Files (x86)\Common Files" -Dir)
       pd       = (Get-Names "C:\ProgramData" -Dir)
       sm       = (Get-Names "C:\ProgramData\Microsoft\Windows\Start Menu\Programs")
       pub      = (Get-Names "C:\Users\Public\Desktop")
       dd       = @(Get-Names "D:\")
       cr       = @(Get-Names "C:\" -Dir)
       sw       = (Get-Keys "HKLM:\SOFTWARE")
       sw32     = (Get-Keys "HKLM:\SOFTWARE\WOW6432Node")
       unin     = (Get-Keys "$cv\Uninstall")
       unin32   = (Get-Keys "$cv32\Uninstall")
       apppaths = (Get-Keys "$cv\App Paths")
       cls      = (Get-Keys "HKLM:\SOFTWARE\Classes")
       svc      = @(Get-CimInstance Win32_Service -ErrorAction SilentlyContinue | ForEach-Object { $_.Name })
       path     = @(([Environment]::GetEnvironmentVariable("Path", "Machine")) -split ';' | Where-Object { $_ })
       mev      = $mev
      }
     }
     '@ | Set-Content -Path "C:\app-lib.ps1"
     @'
     $ErrorActionPreference = "Continue"
     $tar = "$env:SystemRoot\System32\tar.exe"
     if (-not (Test-Path "C:\baseline-apps.json") -or -not (Test-Path "C:\apps-restored.flag")) {
      Write-Host "App capture: baseline/restore abhi pura nahi hua, save skip"
      exit 0
     }
     . "C:\app-lib.ps1"
     $base = Get-Content "C:\baseline-apps.json" -Raw | ConvertFrom-Json
     $cur  = Get-AppState
     $stage = "$env:TEMP\appcap"
     Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue
     New-Item -ItemType Directory -Force -Path "$stage\reg" | Out-Null
     $skipPd = @("Package Cache", "Microsoft", "Windows", "USOPrivate", "USOShared", "SoftwareDistribution", "ssh", "Packages", "regid*")
     $dirs = New-Object System.Collections.ArrayList
     foreach ($n in (Get-New $cur.pf   $base.pf))   { [void]$dirs.Add("Program Files/$n") }
     foreach ($n in (Get-New $cur.pf86 $base.pf86)) { [void]$dirs.Add("Program Files (x86)/$n") }
     $skipTop = @("Windows*", "WindowsApps", "ModifiableWindowsApps", "Common Files", "Internet Explorer", "WindowsPowerShell", "Reference Assemblies", "MSBuild", "dotnet", "Microsoft Update Health Tools")
     $newTop64 = @(Get-New $cur.pf   $base.pf)
     $newTop86 = @(Get-New $cur.pf86 $base.pf86)
     if ($null -ne $base.pf2) {
      foreach ($n in (Get-New $cur.pf2 $base.pf2)) {
       $t = ($n -split '/')[0]
       if ($newTop64 -contains $t) { continue }
       if ($skipTop | Where-Object { $t -like $_ }) { continue }
       [void]$dirs.Add("Program Files/$n")
      }
     }
     if ($null -ne $base.pf862) {
      foreach ($n in (Get-New $cur.pf862 $base.pf862)) {
       $t = ($n -split '/')[0]
       if ($newTop86 -contains $t) { continue }
       if ($skipTop | Where-Object { $t -like $_ }) { continue }
       [void]$dirs.Add("Program Files (x86)/$n")
      }
     }
     foreach ($n in (Get-New $cur.cf   $base.cf))   { [void]$dirs.Add("Program Files/Common Files/$n") }
     foreach ($n in (Get-New $cur.cf86 $base.cf86)) { [void]$dirs.Add("Program Files (x86)/Common Files/$n") }
     foreach ($n in (Get-New $cur.pd   $base.pd))   { if (-not ($skipPd | Where-Object { $n -like $_ })) { [void]$dirs.Add("ProgramData/$n") } }
     foreach ($n in (Get-New $cur.sm   $base.sm))   { [void]$dirs.Add("ProgramData/Microsoft/Windows/Start Menu/Programs/$n") }
     foreach ($n in (Get-New $cur.pub  $base.pub))  { [void]$dirs.Add("Users/Public/Desktop/$n") }
     $skipCr = @("RDPData", "Users", "Windows", "Program Files", "Program Files (x86)", "ProgramData", '$Recycle.Bin', "System Volume Information", "Recovery", "PerfLogs", "Documents and Settings", "hostedtoolcache", "Temp", "tmp")
     foreach ($n in (Get-New $cur.cr $base.cr)) { if (-not ($skipCr -contains $n)) { [void]$dirs.Add($n) } }
     $skipDd = @("a", "System Volume Information", '$RECYCLE.BIN', "pagefile.sys", "swapfile.sys", "hiberfil.sys", "DATALOSS_WARNING_README.txt")
     $ddirs = New-Object System.Collections.ArrayList
     if (Test-Path "D:\") {
      foreach ($n in (Get-New $cur.dd $base.dd)) { if (-not ($skipDd -contains $n)) { [void]$ddirs.Add($n) } }
     }
     $script:i = 0
     function Export-Key($key) {
      $script:i++
      reg export $key "$stage\reg\k_$($script:i).reg" /y 2>&1 | Out-Null
     }
     $cvp   = "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion"
     $cv32p = "HKLM\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion"
     foreach ($n in (Get-New $cur.sw       $base.sw))       { Export-Key "HKLM\SOFTWARE\$n" }
     foreach ($n in (Get-New $cur.sw32     $base.sw32))     { Export-Key "HKLM\SOFTWARE\WOW6432Node\$n" }
     foreach ($n in (Get-New $cur.unin     $base.unin))     { Export-Key "$cvp\Uninstall\$n" }
     foreach ($n in (Get-New $cur.unin32   $base.unin32))   { Export-Key "$cv32p\Uninstall\$n" }
     foreach ($n in (Get-New $cur.apppaths $base.apppaths)) { Export-Key "$cvp\App Paths\$n" }
     foreach ($n in (Get-New $cur.cls      $base.cls))      {
      if ($n -like "AppX*" -or $n -eq "Local Settings" -or $n -eq "PackagedCom") { continue }
      Export-Key "HKLM\SOFTWARE\Classes\$n"
     }
     $svcInfo = @()
     foreach ($n in (Get-New $cur.svc $base.svc)) {
      $s = Get-CimInstance Win32_Service -Filter "Name='$n'" -ErrorAction SilentlyContinue
      if ($s -and $s.PathName -and ($s.PathName -notmatch '(?i)\\Windows\\')) {
       $svcInfo += [pscustomobject]@{ Name = $s.Name; DisplayName = $s.DisplayName; PathName = $s.PathName; StartMode = $s.StartMode }
       Export-Key "HKLM\SYSTEM\CurrentControlSet\Services\$n"
      }
     }
     ConvertTo-Json -InputObject @($svcInfo) | Set-Content "$stage\services.json"
     $newPath = Get-New $cur.path $base.path
     ConvertTo-Json -InputObject @($newPath) | Set-Content "$stage\path.json"
     $envDiff = @{}
     foreach ($k in $cur.mev.Keys) {
      if ($k -eq "ChocolateyLastPathUpdate") { continue }
      if ("$($base.mev.$k)" -ne "$($cur.mev[$k])") { $envDiff[$k] = $cur.mev[$k] }
     }
     $envDiff | ConvertTo-Json | Set-Content "$stage\env.json"
     $sb = New-Object System.Text.StringBuilder
     foreach ($d in $dirs) {
      $m = Get-ChildItem -LiteralPath ("C:\" + ($d -replace '/', '\')) -Recurse -File -Force -ErrorAction SilentlyContinue | Measure-Object Length -Sum
      [void]$sb.Append("$d|$($m.Count)|$($m.Sum);")
     }
